name: Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          if [[ -f settings.gradle.kts || -f settings.gradle ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f SMSGuardian/settings.gradle.kts || -f SMSGuardian/settings.gradle ]]; then
            echo "dir=SMSGuardian" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Gradle settings file not found. Upload the CONTENTS of the SMSGuardian folder to the repository root, or keep the project inside a folder named SMSGuardian."
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi
      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: SMS-Guardian-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
