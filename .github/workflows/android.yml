
name: Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          if [[ -f settings.gradle.kts || -f settings.gradle ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f SMSGuardian/settings.gradle.kts || -f SMSGuardian/settings.gradle ]]; then
            echo "dir=SMSGuardian" >> "$GITHUB_OUTPUT"
          else
            echo "Gradle settings file not found"
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/SMSGuardian-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/SMSGuardian-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: SMS-Guardian-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: SMS-Guardian-release-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
